name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
            artifact_glob: "src-tauri/target/release/bundle/**/*.AppImage"

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
            artifact_glob: "src-tauri/target/release/bundle/**/*-setup.exe"

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Download sidecar binaries
        shell: bash
        run: bash scripts/download-sidecars.sh ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting and types
        run: npm run check

      - name: Run Rust tests
        run: cd src-tauri && cargo test

      - name: Run frontend tests
        run: npm run test:ts

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "ClipCut ${{ inputs.tag_name || github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **Downloads:**
            - **Windows:** `ClipCut-*-x64-setup.exe`
            - **Linux:** `ClipCut-*.AppImage` / `clipcut-*.deb`
          releaseDraft: false
          prerelease: false

  # Separate job: run check in dev mode to catch any import issues
  check-dev:
    runs-on: ubuntu-22.04
    name: Check (dev)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:ts
      - run: |
          cd src-tauri
          cargo fmt --check
          cargo clippy -- -D warnings
