stages:
  - check

variables:
  GIT_DEPTH: 1

check:
  stage: check
  image: rust:1-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
  script:
    - npm ci
    - npm run check:ts
    - npm run test:ts
    - bash scripts/download-sidecars.sh x86_64-unknown-linux-gnu
    - cd src-tauri && cargo test
